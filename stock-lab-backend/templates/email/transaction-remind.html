<!-- src/main/resources/templates/email/transaction-remind.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>定投提醒</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4e73df, #224abe);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 30px;
        }
        .info-box {
            background: #f8f9fc;
            border-left: 4px solid #4e73df;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #718096;
            font-weight: 500;
        }
        .info-value {
            color: #2d3748;
            font-weight: 600;
        }
        .symbol {
            color: #4e73df;
            font-size: 18px;
        }
        .amount {
            color: #48bb78;
            font-size: 20px;
            font-weight: bold;
        }
        .tip {
            background: #fffaf0;
            border: 1px dashed #f6ad55;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            color: #c05621;
            font-size: 14px;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #a0aec0;
            font-size: 12px;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>💰 定投提醒</h1>
    </div>
    <div class="content">
        <p>您好！您的定投计划提醒您进行本期投资：</p>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">标的代码</span>
                <span class="info-value symbol">{{symbol}}</span>
            </div>
            <div class="info-row">
                <span class="info-label">每次预算</span>
                <span class="info-value amount">${{amount}}</span>
            </div>
            <div class="info-row">
                <span class="info-label">定投频率</span>
                <span class="info-value">{{frequencyDesc}}</span>
            </div>
            <div class="info-row">
                <span class="info-label">已投资次数</span>
                <span class="info-value">{{totalInvestTimes}} 次</span>
            </div>
            <div class="info-row">
                <span class="info-label">已投资金额</span>
                <span class="info-value">${{totalInvestAmount}}</span>
            </div>
            <div class="info-row">
                <span class="info-label">目标总价值</span>
                <span class="info-value">{{targetTotalValue}}</span>
            </div>
        </div>

        <div class="tip">
            <strong>温馨提示：</strong><br>
            请在完成定投后及时在云端记录，以便系统为您生成下次定投提醒。详情可在「定投计划 - 历史记录」中查看。
        </div>
    </div>
    <div class="footer">
        © {{year}}
        {{appName}}. 保留所有权利。<br>
        此邮件为系统自动发送，请勿直接回复。
    </div>
</div>
</body>
</html>
