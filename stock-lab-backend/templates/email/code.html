<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>验证码</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4e73df, #224abe);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 30px;
            text-align: center;
        }
        .code-box {
            background: #f8f9fc;
            border: 1px dashed #cbd5e0;
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #2d3748;
            display: inline-block;
            width: 220px;
        }
        .tip {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #a0aec0;
            font-size: 12px;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>邮箱验证码</h1>
    </div>
    <div class="content">
        <p>您好！您正在尝试登录或注册 {{appName}} 账户。</p>
        <p>请在5分钟内使用以下验证码完成操作：</p>
        <div class="code-box">{{code}}</div>
        <p class="tip">如非本人操作，请忽略此邮件。为保障账户安全，切勿将验证码告知他人。</p>
    </div>
    <div class="footer">
        © {{year}} {{appName}}. 保留所有权利。<br>
        此邮件为系统自动发送，请勿直接回复。
    </div>
</div>
</body>
</html>
